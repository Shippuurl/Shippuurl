<!--
  Minimal monochrome profile banner.
  Customize the text in the #identity group (eyebrow, title and handle).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">凛時雨 · Shippuurl</title>
  <desc id="desc">A customizable black, white and gray GitHub profile banner.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.58" stop-color="#18181b"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fafafa" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#09090b" stop-opacity="0.05"/>
      <stop offset="0.72" stop-color="#09090b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" rx="18" fill="url(#background)"/>
  <rect width="1600" height="420" rx="18" fill="url(#grid)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M790 420L1180 0M930 420L1320 0M1070 420L1460 0M1210 420L1600 30" stroke="#a1a1aa" stroke-opacity="0.24" stroke-width="1"/>
    <path d="M0 328C280 275 430 382 704 325s436-74 896 11" stroke="#f4f4f5" stroke-opacity="0.22"/>
    <path d="M0 330C280 277 430 384 704 327s436-74 896 11" stroke="#f4f4f5" stroke-opacity="0.09" stroke-width="8"/>
  </g>
  <rect width="1600" height="420" rx="18" fill="url(#fade)"/>

  <g id="identity" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
    <!-- Edit these three lines to customize the banner. -->
    <text id="eyebrow" x="104" y="112" fill="#a1a1aa" font-size="16" font-weight="600" letter-spacing="6">GITHUB / PROFILE</text>
    <rect x="104" y="136" width="148" height="3" rx="1.5" fill="#f4f4f5"/>
    <text id="title" x="104" y="240" fill="#fafafa" font-size="82" font-weight="700" letter-spacing="2">凛時雨</text>
    <text id="handle" x="108" y="292" fill="#d4d4d8" font-size="27" font-weight="500" letter-spacing="4">@Shippuurl</text>
  </g>

  <g transform="translate(1340 112)" fill="none" stroke="#e4e4e7" stroke-opacity="0.62">
    <rect x="0" y="0" width="142" height="142" rx="71" stroke-width="1"/>
    <rect x="20" y="20" width="102" height="102" rx="51" stroke-width="1"/>
    <path d="M71 0V142M0 71H142" stroke-opacity="0.3"/>
    <circle cx="71" cy="71" r="5" fill="#fafafa" stroke="none"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#71717a" font-size="13" letter-spacing="3">
    <text x="104" y="372">01 — 03</text>
    <text x="1364" y="302">MONO / 2026</text>
  </g>
  <rect x="104" y="389" width="1392" height="1" fill="#fafafa" fill-opacity="0.18"/>
</svg>
